name = "syncflex"
url = "https://github.com/leonarduschen/syncflex"
blurb = "A tiny library that lets you write one generator function and run it in either a sync or an async context. `@syncify` makes it blocking, `@asyncify` makes it awaitable — no duplicated code paths."


